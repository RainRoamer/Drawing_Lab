name: Drawing Lab checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux fonts and Cairo
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config fonts-noto-cjk fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -B tests/test_drawkit.py
      - run: python -X utf8 -B -m unittest discover -s tests -p "test_regressions.py"
